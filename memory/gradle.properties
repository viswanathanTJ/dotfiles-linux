# Memory caps for every Gradle build on this PC (this file overrides each project's gradle.properties).
# Several Claude sessions can build Android projects at once; uncapped, their Gradle and Kotlin
# processes filled 32 GB and froze the PC (2026-10-25).

# Gradle build process: at most 3 GB heap
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
# Kotlin compiler process: at most 1.5 GB
kotlin.daemon.jvmargs=-Xmx1536m
# Idle build processes exit after 10 minutes (default 3 hours, holding their memory all that time)
org.gradle.daemon.idletimeout=600000
# At most 4 build tasks in parallel (default: one per CPU thread = 24)
org.gradle.workers.max=4
