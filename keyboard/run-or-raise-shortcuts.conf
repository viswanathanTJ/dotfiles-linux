# Run or raise: shortcut,command,[wm_class],[title]
# Focus an existing window whose wm_class matches, otherwise run the command.
# Shortcuts shared by every machine. Machine-only ones (Alt+Caps+X, Alt+Caps+M) go in
# ~/.config/run-or-raise/shortcuts.local.conf (not tracked; see examples/).
# reload-shortcuts joins both into ~/.config/run-or-raise/shortcuts.conf, the file Run or Raise reads.

# Ctrl+Alt+Super+B (Alt+Caps+B): Chrome. Exact wm_class, so Chrome web apps (Outlook, Teams) aren't matched.
<Control><Alt><Super>b,gtk-launch google-chrome,/^[Gg]oogle-chrome$/,

# Ctrl+Alt+Super+C (Alt+Caps+C): VS Code
<Control><Alt><Super>c,gtk-launch com.microsoft.VSCode,/^(code|Code|com\.microsoft\.VSCode)$/,
# Ctrl+Alt+Super+T (Alt+Caps+T): kitty
<Control><Alt><Super>t,gtk-launch kitty,/^kitty$/,
<Control><Alt><Super>k,gtk-launch kitty,/^kitty$/,
# Ctrl+Alt+Super+W (Alt+Caps+W): ZapZap (WhatsApp)
<Control><Alt><Super>w,gtk-launch com.rtosta.zapzap,/^(zapzap|ZapZap|com\.rtosta\.zapzap)$/,
# Ctrl+Alt+Super+N (Alt+Caps+N): Telegram (official tarball in ~/.local/opt/Telegram)
<Control><Alt><Super>n,sh -c "exec $HOME/.local/opt/Telegram/Telegram",/^(TelegramDesktop|org\.telegram\.desktop.*)$/,
# Ctrl+Alt+Super+A (Alt+Caps+A): AyuGram
<Control><Alt><Super>a,gtk-launch com.ayugram.desktop.desktop,/^([Aa]yu[Gg]ram|com\.ayugram\.desktop)$/,
# Ctrl+Alt+Super+P (Alt+Caps+P): Postman (tarball in ~/.local/opt/Postman)
<Control><Alt><Super>p,gtk-launch postman,/^[Pp]ostman$/,
