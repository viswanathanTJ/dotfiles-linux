# Change prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Nested tmux over ssh: Ctrl+a = this machine's tmux; in a pane running ssh, Ctrl+b goes to the
# remote tmux as its Ctrl+a prefix. In local panes Ctrl+b stays plain Ctrl+b (fish: back one char).
bind -n C-b if -F '#{==:#{pane_current_command},ssh}' 'send-keys C-a' 'send-keys C-b'

setw -g mouse on
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
setw -g mode-keys vi
set -g focus-events on
setw -g monitor-activity on
set -g visual-activity off

bind Tab last-window
bind S setw synchronize-panes \; display "sync #{?synchronize-panes,on,off}"
bind C-l send-keys 'C-l' \; send-keys -R \; clear-history

# Mouse-copy: copy, briefly show the highlight, but DON'T jump to bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode-vi DoubleClick1Pane \
	select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection
bind -T copy-mode-vi TripleClick1Pane \
	select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection

# Keyboard copy-mode (vi): v to start selecting, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind x kill-pane
bind X kill-window
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1


# Remap split keys to | and -
bind 's' split-window -h -c "#{pane_current_path}"
bind 'v' split-window -v -c "#{pane_current_path}"

bind w choose-tree -Zs
bind b break-pane -d
bind @ choose-window 'join-pane -h -s "%%"'

# Pane navigation (left uses default `prefix Left` arrow):
bind -r k select-pane -U
bind -r h select-pane -L
bind -r j select-pane -D
bind -r l select-pane -R


bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"

# Optional: Unbind the default keys to free them up
#unbind '"'
#unbind %

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'catppuccin/tmux'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Per-pane restore of AI assistant (Claude Code) sessions. A SessionStart hook
# records each pane's real session ID, and on restore each pane is reattached to
# its OWN conversation via `claude --resume <id>` (handles two Claudes in one
# dir). Do NOT add claude to @resurrect-processes — this plugin owns resuming.
set -g @plugin 'timvw/tmux-assistant-resurrect'

# Enable automatic restoring via tmux-continuum
set -g @continuum-restore 'on'


# Catppuccin theme configuration
set -g @catppuccin_flavour 'mocha' # or frappe, macchiato, latte
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_middle_separator " | "

# Initialize TMUX plugin manager (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Fix for tmux 3.4: the assistant plugin sets its hooks as bash "$HOME"'/...', but tmux
# prints that back as "\$HOME", so the hook never finds its script and Claude panes are
# never saved or resumed. Re-set both hooks with a ~ path (after tpm, so these win).
set -g @resurrect-hook-post-save-all 'bash ~/.tmux/plugins/tmux-assistant-resurrect/scripts/save-assistant-sessions.sh'
set -g @resurrect-hook-post-restore-all 'bash ~/.tmux/plugins/tmux-assistant-resurrect/scripts/restore-assistant-sessions.sh'
