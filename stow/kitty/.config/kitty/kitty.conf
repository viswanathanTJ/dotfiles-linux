# ── Fonts ─────────────────────────────────────────
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# keep => != -> ligatures (options: never | always | cursor)
disable_ligatures never

# ── Cursor ────────────────────────────────────────
# block | beam | underline
cursor_shape     beam
# 0 = no blinking
cursor_blink_interval 0

# ── Scrollback ────────────────────────────────────
scrollback_lines 10000

# ── Mouse & clipboard ─────────────────────────────
# selecting text copies it
copy_on_select   yes
strip_trailing_spaces smart
mouse_hide_wait  3.0

# ── Window ────────────────────────────────────────
# no title bar, buttons or border (restart kitty to apply)
hide_window_decorations yes
remember_window_size  yes
window_padding_width  6
# don't ask before closing a window
confirm_os_window_close 0
enable_audio_bell no

# ── Tabs ──────────────────────────────────────────
tab_bar_edge     top
tab_bar_style    powerline
tab_powerline_style slanted

# ── Theme / opacity ───────────────────────────────
# e.g. 0.95 for slight transparency
background_opacity 1.0

# ── Shell ─────────────────────────────────────────
shell            /usr/bin/fish
shell_integration enabled

# ── Handy shortcuts ───────────────────────────────
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+f5 load_config_file

# ── Splits (panes) ────────────────────────────────
# splits layout: each new pane goes where you ask; stack = one pane full screen
enabled_layouts splits,stack
# Caps+Shift+Enter: new pane to the right (side by side), same folder
map ctrl+shift+enter launch --location=vsplit --cwd=current
# Caps+Shift+\ : new pane below (top/bottom), same folder
map ctrl+shift+backslash launch --location=hsplit --cwd=current
# Caps+Shift+Z: zoom the current pane to full window and back
map ctrl+shift+z toggle_layout stack
