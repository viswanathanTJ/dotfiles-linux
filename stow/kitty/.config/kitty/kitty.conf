# ─── Font ──────────────────────────────────────────────
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Fira Code ligatures (=> != ===); show raw chars only under the cursor
disable_ligatures cursor

# ─── Cursor (animated) ─────────────────────────────────
cursor_shape              beam
cursor_shape_unfocused    hollow
cursor_blink_interval     0.5 ease-in-out
cursor_stop_blinking_after 15.0
# Smooth trail when the cursor jumps
cursor_trail              3
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2

# ─── Tabs (powerline, slanted) ─────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
tab_title_template    " {index}: {title[:30]}{' ' if layout_name == 'stack' else ''} "
active_tab_font_style bold
tab_activity_symbol   " "
bell_on_tab           "󰂚 "

# ─── Window ────────────────────────────────────────────
window_padding_width   8
background_opacity     0.95
# No title bar (removes minimise/close header); move window with Super+drag
hide_window_decorations yes
confirm_os_window_close 0
enabled_layouts        splits,stack,tall
remember_window_size   yes
inactive_text_alpha    0.85

# ─── Scrollback & mouse ────────────────────────────────
scrollback_lines       10000
copy_on_select         clipboard
strip_trailing_spaces  smart
mouse_hide_wait        3.0
url_style              curly
detect_urls            yes
underline_hyperlinks   hover

# ─── Bell ──────────────────────────────────────────────
enable_audio_bell      no
# No screen flash on bell (it flashed the selection blue on tab switches); the tab still
# gets the bell icon (bell_on_tab) and the window an urgency alert
visual_bell_duration   0
window_alert_on_bell   yes

# ─── Performance ───────────────────────────────────────
repaint_delay  8
input_delay    2
sync_to_monitor yes

# ─── Remote control (lets scripts reload config) ───────
allow_remote_control socket-only
listen_on unix:@kitty

# ─── Theme: Tokyo Night ────────────────────────────────
foreground            #c0caf5
background            #1a1b26
selection_foreground  #1a1b26
selection_background  #7aa2f7
cursor                #c0caf5
cursor_text_color     #1a1b26
url_color             #73daca
active_border_color   #7aa2f7
inactive_border_color #292e42
bell_border_color     #e0af68

tab_bar_background    #15161e
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# ─── Shell ─────────────────────────────────────────────
shell            /usr/bin/fish
shell_integration enabled

# ─── Keys ──────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+f5    load_config_file

# Splits (panes): splits layout puts each new pane where you ask; stack = one pane full screen
# Caps+Shift+Enter: new pane to the right (side by side), same folder
map ctrl+shift+enter     launch --location=vsplit --cwd=current
# Caps+Shift+\ : new pane below (top/bottom), same folder
map ctrl+shift+backslash launch --location=hsplit --cwd=current
# Caps+Shift+Z: zoom the current pane to full window and back
map ctrl+shift+z         toggle_layout stack

# Move split panes / rotate split orientation
map ctrl+alt+up    move_window up
map ctrl+alt+down  move_window down
map ctrl+alt+left  move_window left
map ctrl+alt+right move_window right
map ctrl+alt+r     layout_action rotate

# Super+. acts like Alt+. (fish: insert last argument of previous command)
map super+period send_key alt+period

map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# ─── Tabs by number ────────────────────────────────────
# Alt+1..9 (Cmd+number) and Caps+1..9 both reach kitty as Ctrl+1..9 (through Toshy)
# Caps+1..9 (Ctrl+N) = tmux window 1..9: sends Alt+Shift+N (Esc + !, @, #...), which ~/.tmux.conf binds.
# (# is written \x23 so kitty doesn't read it as a comment.) kitty's own tabs: Ctrl+Tab / Ctrl+Shift+Tab.
map ctrl+1 send_text all \x1b!
map ctrl+2 send_text all \x1b@
map ctrl+3 send_text all \x1b\x23
map ctrl+4 send_text all \x1b$
map ctrl+5 send_text all \x1b%
map ctrl+6 send_text all \x1b^
map ctrl+7 send_text all \x1b&
map ctrl+8 send_text all \x1b*
map ctrl+9 send_text all \x1b(
